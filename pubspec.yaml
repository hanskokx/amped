name: amped
description: "Crank it up."
publish_to: "none"
version: 0.1.2+1

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  amped_audacious_skin:
    path: packages/amped_audacious_skin
  amped_audiobookshelf:
    path: packages/amped_audiobookshelf
  amped_bamp_skin:
    path: packages/amped_bamp_skin
  amped_classic_skin:
    path: packages/amped_classic_skin
  amped_jellyfin:
    path: packages/amped_jellyfin
  amped_l10n:
    path: packages/amped_l10n
  amped_logging:
    path: packages/amped_logging
  amped_media_source:
    path: packages/amped_media_source
  amped_plex:
    path: packages/amped_plex
  amped_podcast:
    path: packages/amped_podcast
  amped_skin:
    path: packages/amped_skin
  amped_soundcloud:
    path: packages/amped_soundcloud
  amped_subsonic:
    path: packages/amped_subsonic
  amped_update_checker:
    path: packages/amped_update_checker
  amped_vis:
    path: packages/amped_vis
  amped_wasabi:
    path: packages/amped_wasabi
  amped_youtube:
    git:
      url: https://git.hadak.org/Amped/amped_youtube.git
  amped_ytdlp:
    git:
      url: https://git.hadak.org/Amped/amped_ytdlp.git
  archive: ^4.7.1
  audio_metadata_reader: ^1.8.1
  chromaprint_dart: ^1.0.0
  crypto: ^3.0.8
  custom_cursor:
    git:
      url: https://github.com/hanskokx/flutter_custom_cursor.git
  dart_cast:
    path: packages/dart_cast
  dbus: ^0.8.0
  ffi: ^2.2.0
  file_drop:
    path: packages/file_drop
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_soloud: ^5.2.2
  material_ui: ^1.0.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  pcm_decoder:
    path: packages/pcm_decoder
  shared_preferences: ^2.5.5
  skin_preview:
    path: packages/skin_preview
  smb_connect: ^0.0.9
  sqlite3: ^3.9.1
  svg_flutter: ^0.0.1
  tiny_fullscreen_vis:
    git:
      url: https://git.hadak.org/Amped/tiny_fullscreen_vis.git
  tray_manager: ^0.9.0
  url_launcher: ^6.3.3
  window_dock:
    path: packages/window_dock
  xml: ^6.6.1

dev_dependencies:
  arcane_analysis: ^1.0.5
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter

# media_kit at the head of upstream pull request #1481 (Windows video rendered
# straight to D3D11 textures, libmpv 0.42; #1436 was folded into it). Switch
# back to the released packages once it is released.
dependency_overrides:
  media_kit:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: media_kit
  media_kit_libs_android_video:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: libs/android/media_kit_libs_android_video
  media_kit_libs_ios_video:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: libs/ios/media_kit_libs_ios_video
  media_kit_libs_linux:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: libs/linux/media_kit_libs_linux
  media_kit_libs_macos_video:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: libs/macos/media_kit_libs_macos_video
  media_kit_libs_windows_video:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: libs/windows/media_kit_libs_windows_video
  media_kit_video:
    git:
      url: https://github.com/media-kit/media-kit
      ref: 7d27e41f17d7d6917a12a9779a4ed6623155ef41
      path: media_kit_video

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/logos/
    - assets/skins/
    - assets/plugins/
