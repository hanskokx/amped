    git:
      url: https://git.hadak.org/Amped/pcm_decoder.git
  shared_preferences: ^2.5.5
  skin_preview:
    path: packages/skin_preview
  smb_connect: ^0.0.9
  sqlite3: ^3.9.1
  svg_flutter: ^0.0.1
  tray_manager: ^0.9.0
  url_launcher: ^6.3.3
  window_dock:
    git:
      url: https://git.hadak.org/Amped/window_dock.git
  xml: ^6.6.1

dev_dependencies:
  arcane_analysis: ^1.0.5
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
