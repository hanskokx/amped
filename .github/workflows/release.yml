name: Release

# Runs the tests, builds the installers and publishes them as a release of the
# version in pubspec.yaml (tag v<version>). Start it by hand.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

env:
  # YouTube support is built in unless the YOUTUBE_ENABLED repository
  # variable is explicitly false.
  STRIP_YOUTUBE: ${{ vars.YOUTUBE_ENABLED == 'false' }}
  ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY || vars.ACOUSTID_API_KEY }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          full=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1 | tr -d ' "')
          echo "version=${full%%+*}" >> "$GITHUB_OUTPUT"
          case "$full" in
            *+*) echo "build=${full##*+}" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=1" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: The release must not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.read.outputs.version }}
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version exists; raise the version in pubspec.yaml."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hadak-git
        with:
          token: ${{ secrets.INTERNAL_GIT_ACCESS_KEY }}
          ssh-key: ${{ secrets.SSH_KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libmpv-dev mpv \
            libasound2-dev libayatana-appindicator3-dev
      - name: Take YouTube out
        if: ${{ env.STRIP_YOUTUBE == 'true' }}
        run: dart run tool/strip_youtube.dart
      - run: flutter pub get
      - name: App tests
        run: flutter test
      - name: Package tests
        run: |
          for package in packages/*/; do
            [ -d "$package/test" ] || continue
            echo "::group::$package"
            (cd "$package" && flutter pub get && flutter test)
            echo "::endgroup::"
          done

  windows:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            flutter-arch: x64
            build-dir: x64
            inno-arch: x64compatible
            label: x64
          - runner: windows-11-arm
            flutter-arch: arm64
            build-dir: arm64
            inno-arch: arm64
            label: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hadak-git
        with:
          token: ${{ secrets.INTERNAL_GIT_ACCESS_KEY }}
          ssh-key: ${{ secrets.SSH_KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter-arch }}
          cache: true
      - name: Take YouTube out
        if: ${{ env.STRIP_YOUTUBE == 'true' }}
        run: dart run tool/strip_youtube.dart
      - run: flutter pub get
      - name: Build
        run: |
          flutter build windows --release \
            --dart-define=AMPED_GIT_COMMIT=$(git rev-parse --short HEAD) \
            --dart-define=ACOUSTID_API_KEY="$ACOUSTID_API_KEY"
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Installer
        run: |
          cd windows/installer
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            //DAppVersion=${{ needs.version.outputs.version }} \
            //DArch=${{ matrix.inno-arch }} \
            //DArchLabel=${{ matrix.label }} \
            //DSourceDir=..\\..\\build\\windows\\${{ matrix.build-dir }}\\runner\\Release \
            amped.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.label }}
          path: build/installer/*.exe
          if-no-files-found: error

  macos:
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hadak-git
        with:
          token: ${{ secrets.INTERNAL_GIT_ACCESS_KEY }}
          ssh-key: ${{ secrets.SSH_KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Take YouTube out
        if: ${{ env.STRIP_YOUTUBE == 'true' }}
        run: dart run tool/strip_youtube.dart
      - run: flutter pub get
      - name: Build (universal)
        run: |
          flutter build macos --release \
            --dart-define=AMPED_GIT_COMMIT=$(git rev-parse --short HEAD) \
            --dart-define=ACOUSTID_API_KEY="$ACOUSTID_API_KEY"
      - name: Disk images
        run: |
          version=${{ needs.version.outputs.version }}
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          mkdir -p dist

          dmg() { # dmg <app> <name>
            rm -rf dmgroot && mkdir dmgroot
            cp -R "$1" dmgroot/Amped.app
            ln -s /Applications dmgroot/Applications
            hdiutil create -volname Amped -srcfolder dmgroot -ov -format UDZO "dist/$2"
          }

          lipo -archs "$app/Contents/MacOS/$(basename "$app" .app)"
          dmg "$app" "Amped-$version-macos-universal.dmg"

          # Apple silicon only: every universal Mach-O file thinned to arm64,
          # then signed again (ad hoc), as thinning breaks the signatures.
          rm -rf arm && mkdir arm && cp -R "$app" arm/Amped.app
          find arm/Amped.app -type f | while read -r file; do
            if lipo -archs "$file" 2>/dev/null | grep -q x86_64; then
              lipo -thin arm64 "$file" -output "$file.thin"
              mv "$file.thin" "$file"
            fi
          done
          codesign --force --deep --sign - arm/Amped.app
          lipo -archs "arm/Amped.app/Contents/MacOS/$(basename "$app" .app)"
          dmg arm/Amped.app "Amped-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hadak-git
        with:
          token: ${{ secrets.INTERNAL_GIT_ACCESS_KEY }}
          ssh-key: ${{ secrets.SSH_KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config rpm ruby \
            libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libmpv-dev mpv \
            libasound2-dev libayatana-appindicator3-dev
          sudo gem install --no-document fpm
      - name: Take YouTube out
        if: ${{ env.STRIP_YOUTUBE == 'true' }}
        run: dart run tool/strip_youtube.dart
      - run: flutter pub get
      - name: Build
        run: |
          flutter build linux --release \
            --dart-define=AMPED_GIT_COMMIT=$(git rev-parse --short HEAD) \
            --dart-define=ACOUSTID_API_KEY="$ACOUSTID_API_KEY"
      - name: DEB and RPM
        run: |
          tool/package_linux.sh \
            ${{ needs.version.outputs.version }} \
            ${{ needs.version.outputs.build }} \
            build/linux/x64/release/bundle dist
      - name: AppImage
        run: |
          sudo apt-get install -y libfuse2 desktop-file-utils
          curl -fsSL -o /usr/local/bin/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/appimagetool
          tool/package_appimage.sh \
            ${{ needs.version.outputs.version }} \
            build/linux/x64/release/bundle dist
      - name: Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49
          tool/package_flatpak.sh ${{ needs.version.outputs.version }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
          if-no-files-found: error

  release:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.version.outputs.version }}
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          # The notes are collected by GitHub from the pull requests and
          # commits since the previous release.
          gh release create "v$version" ./* $flags \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Amped $version" \
            --generate-notes

  # Publishes release.json to https://www.amped-player.com/release.json by
  # committing it to the website repository, whose pipeline deploys it.
  website:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          PRERELEASE: ${{ inputs.prerelease }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: |
          cd dist
          {
            printf '{\n  "version": "%s",\n  "build": %s,\n  "prerelease": %s,\n' \
              "$VERSION" "$BUILD" "$PRERELEASE"
            printf '  "published": "%s",\n  "notes": "https://github.com/%s/releases/tag/v%s",\n  "assets": [\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.repository }}" "$VERSION"
            first=1
            for f in *; do
              [ "$f" = SHA256SUMS ] && continue
              [ $first = 1 ] || printf ',\n'
              first=0
              printf '    {"name": "%s", "url": "%s/%s", "size": %s, "sha256": "%s"}' \
                "$f" "$BASE" "$f" "$(wc -c < "$f" | tr -d ' ')" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            printf '\n  ]\n}\n'
          } > ../release.json
          cat ../release.json
      - name: Push to the website repository
        env:
          SSH_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/website_ed25519
          chmod 600 ~/.ssh/website_ed25519
          ssh-keyscan -p 2222 -T 10 git.hadak.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/website_ed25519 -o IdentitiesOnly=yes"
          git clone --depth 1 ssh://git@git.hadak.org:2222/Amped/amped_website.git site
          cp release.json site/web/release.json
          cd site
          git config user.name "Amped release"
          git config user.email "release@amped-player.com"
          git add web/release.json
          git commit -m "Release ${{ needs.version.outputs.version }}"
          git push origin HEAD:main
