name: pcm_decoder
description: >-
  Decodes audio files (WAV, FLAC, MP3) to interleaved 16-bit PCM with every
  channel, for fingerprinting. Built from miniaudio with a native-assets hook.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.5

dev_dependencies:
  arcane_analysis: ^1.0.5
  test: ^1.31.1
