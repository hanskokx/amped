name: skin_preview
description: >-
  Pictures of skins, drawn by the same native renderer the file
  manager previews (Quick Look, Explorer, freedesktop thumbnails) use.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ^3.12.2


dependencies:
  archive: ^4.0.9
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.5

dev_dependencies:
  arcane_analysis: ^1.0.5
  test: any
